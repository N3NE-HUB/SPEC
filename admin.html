<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NodeCheck — Admin</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="container">
      <div class="card admin-login">
        <h2>🔐 Admin Login</h2>
        <div class="form-group">
          <label for="adminPass">Password</label>
          <input type="password" id="adminPass" placeholder="Enter admin password" onkeydown="if(event.key==='Enter') login()" autofocus />
        </div>
        <button class="btn btn-primary" onclick="login()" style="width:100%;justify-content:center;margin-top:.5rem;">
          Sign In
        </button>
        <div id="loginError" class="error-msg" style="display:none;margin-top:.85rem;">
          <span>⚠️</span> Incorrect password. Please try again.
        </div>
      </div>
    </div>
  </div>

  <!-- ADMIN DASHBOARD (hidden until login) -->
  <div id="adminDash" style="display:none;">

    <header class="site-header">
      <div class="container">
        <div class="header-inner">
          <div class="logo">
            <span class="logo-icon">📡</span>
            <span class="logo-text">NodeCheck <span style="opacity:.5;font-weight:400;font-size:.85rem;">Admin</span></span>
          </div>
          <div style="display:flex;align-items:center;gap:1rem;">
            <span id="reportCount" style="font-size:.85rem;color:var(--text-muted);">Loading…</span>
            <button class="logout-btn" onclick="logout()">Log Out</button>
          </div>
        </div>
      </div>
    </header>

    <section class="admin-section container">
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem;">
          <h2>Submitted Reports</h2>
          <button class="btn btn-primary" onclick="exportCsv()" style="font-size:.85rem;padding:.5rem 1.1rem;">
            ⬇️ Export CSV
          </button>
        </div>

        <div class="report-table-wrap">
          <table id="reportsTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Date</th>
                <th>Name</th>
                <th>ZIP</th>
                <th>Provider</th>
                <th>Status / Experience</th>
                <th>City</th>
                <th>State</th>
                <th>IP</th>
                <th>Email</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody id="reportsBody">
              <tr><td colspan="11" class="empty-state">Loading reports…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <div class="container">
        <p>NodeCheck Admin Panel — private &amp; password-protected</p>
        <p style="margin-top:.4rem;font-size:.8rem;"><a href="index.html" style="color:var(--text-muted);">← Back to public site</a></p>
      </div>
    </footer>
  </div>

  <script src="admin.js"></script>
</body>
</html>
